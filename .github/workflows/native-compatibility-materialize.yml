name: Materialize native compatibility audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: native-compatibility-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.head_ref == 'fix/native-project-compatibility-audit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact verified source delta without replacing concurrent work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-audit
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          ids=['d5c95b8ef0df471cd4216354f2363ca7a06f0d4f','d800f56b2974cd9f9b58455664560ddd7ae1bd24','f01145670fcfab1e6167197cc9b2ddcea9de861d']
          chunks=[]
          for sha in ids:
              request=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              chunks.append(base64.b64decode(json.load(urllib.request.urlopen(request))['content']))
          packed=b''.join(chunks)
          assert hashlib.sha256(packed).hexdigest()=='52597fcd5a6b0a0ef90f897e34f1acfbc128431f19818d37099d7ae57594191e'
          delta=json.loads(lzma.decompress(packed))
          allowed={'docs/NATIVE-COMPATIBILITY-REVIEW.md','docs/NATIVE-PROJECTS.md','package.json','src/project/formats.js','src/project/frx.js','src/project/native-code.js','src/project/native-directory.js','src/project/native-project.js','src/project/native-source.js','src/project/native-text.js','src/project/zip.js','tests/native-compatibility-review.test.mjs','tests/native-directory.test.mjs','tests/native-zip.test.mjs','tools/native-project-browser-tests.py'}
          assert len(delta['files'])==len(allowed) and {f['path'] for f in delta['files']}==allowed
          outputs=[]
          for item in delta['files']:
              path=pathlib.Path(item['path']); before=path.read_bytes() if path.exists() else None
              actual=hashlib.sha256(before).hexdigest() if before is not None else None
              if actual==item['after']:
                  continue
              assert actual==item['before'], 'Concurrent edit: '+str(path)
              if 'text' in item:
                  text=item['text']
              else:
                  text=before.decode('utf-8'); previous=len(text)
                  for start,end,replacement in sorted(item['edits'],key=lambda e:e[0],reverse=True):
                      assert 0<=start<=end<=previous
                      text=text[:start]+replacement+text[end:]; previous=start
              output=text.encode('utf-8')
              assert hashlib.sha256(output).hexdigest()==item['after'], 'Output digest mismatch: '+str(path)
              outputs.append((path,output))
          for path,output in outputs:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(output)
          pathlib.Path('/tmp/native-audit/source-digests.json').write_text(json.dumps([{k:v for k,v in f.items() if k in ('path','before','after')} for f in delta['files']],indent=2))
          print('Applied',len(outputs),'verified source files; other main changes are retained')
          PY
      - name: Build and complete regression validation
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/native-audit/build.log
          npm run test:project-files 2>&1 | tee /tmp/native-audit/native-tests.log
          npm test 2>&1 | tee /tmp/native-audit/all-tests.log
      - name: Commit validated sources and reproducible bundles only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/NATIVE-COMPATIBILITY-REVIEW.md docs/NATIVE-PROJECTS.md package.json src/project tests/native-compatibility-review.test.mjs tests/native-directory.test.mjs tests/native-zip.test.mjs tools/native-project-browser-tests.py dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: preserve native VB6 declarations, paths, resources and legacy ZIP workspaces'
          fi
          npm run build
          git diff --exit-code -- dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          git rev-parse HEAD > /tmp/native-audit/commit.txt
          git bundle create /tmp/native-audit/repository.bundle HEAD refs/remotes/origin/main
          git push origin HEAD:refs/heads/fix/native-project-compatibility-audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compatibility-audit-source
          path: /tmp/native-audit/
          retention-days: 7
