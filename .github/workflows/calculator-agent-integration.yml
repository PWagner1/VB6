name: Integrate Calculator and current IDE
on:
  push:
    branches: [fix/win32-calculator-numeric-export]
    paths: [.github/workflows/calculator-agent-integration.yml]
permissions:
  contents: write
concurrency:
  group: calculator-agent-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/win32-calculator-numeric-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge pinned main without discarding source changes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=368fac5d9a9bad449fdcb5e49cc4cc1194ba88f0
          git merge-base --is-ancestor 6d587b674f9116312661d3d474ff8833e3ebecbf "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0')
          paths = [p for p in paths if p]
          if not paths:
              raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Source conflict requires review: ' + p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p], check=True)
              subprocess.run(['git','add','--',p], check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check --cached
          git commit -m 'merge: retain classic coding agents alongside native Calculator export' -m 'Preserve pinned main 368fac5d9a9bad449fdcb5e49cc4cc1194ba88f0. Rebuild generated conflicts from the combined readable sources and run the complete suite. Numeric compiler behavior and original Calculator source remain unchanged.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/fix/win32-calculator-numeric-export
