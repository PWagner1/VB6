name: Apply native parameter ownership fix
on:
  push:
    branches: [feat/native-dynamic-arrays-integration]
    paths: ['.github/workflows/native-owner-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/native-dynamic-arrays-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed local-ownership correction
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          path=Path('src/native/compiler.js')
          source=path.read_text()
          before='const v=local(p.name,p.type,p);v.incomingOffset'
          after='const v=local(p.name,p.type,{...p,parameter:false});v.incomingOffset'
          assert source.count(before)==1, 'Unexpected source; do not patch another revision'
          source=source.replace(before,after)
          assert hashlib.sha256(source.encode()).hexdigest()=='0adee139b81253026e391b94326ca6e2f6b3806d8e3c30f482f7104e96f5b427'
          path.write_text(source)
      - run: npm run build
      - run: npm test
      - name: Commit tested source and bundles, remove the one-use workflow
        run: |
          rm .github/workflows/native-owner-refresh.yml
          git add src/native/compiler.js dist src/exporter/runtime-payload.js .github/workflows/native-owner-refresh.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(native): initialize and release ByVal String copies as owned locals'
          git push origin HEAD:refs/heads/feat/native-dynamic-arrays-integration
