name: Refresh bugfix distributions
on:
  push:
    branches: [fix/designer-nonvisual-selection, fix/live-editor-control-list, fix/editor-event-selection, fix/form-keyboard-mouse-input]
permissions:
  contents: write
concurrency:
  group: refresh-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed source replacements
        run: node tools/apply-fix.mjs
      - run: npm run build
      - run: npm test
      - name: Commit source fix and deterministic build outputs to this branch
        run: |
          git add src/designer/designer.js src/editor/editor.js src/ide/documents.js src/controls/controls.js
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix: apply reviewed source change and regenerate distributions'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
