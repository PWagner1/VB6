name: Refresh bugfix distributions
on:
  push:
    branches: [fix/designer-nonvisual-selection, fix/live-editor-control-list, fix/editor-event-selection, fix/form-keyboard-mouse-input]
permissions:
  contents: write
concurrency:
  group: refresh-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate main without choosing sides in source conflicts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            while IFS= read -r path; do
              case "$path" in
                dist/*|src/exporter/runtime-payload.js|src/editor/diagnostics-payload.js)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *) echo "Source conflict requires review: $path"; exit 1 ;;
              esac
            done < <(git diff --name-only --diff-filter=U)
          fi
      - name: Apply reviewed source replacements when present
        run: if test -f tools/apply-fix.mjs; then node tools/apply-fix.mjs; fi
      - run: npm run build
      - run: npm test
      - name: Commit reviewed source and deterministic outputs to this branch
        run: |
          git add src/designer/designer.js src/editor/editor.js src/ide/documents.js src/controls/controls.js
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD; then
            git commit -m 'build: integrate main and regenerate validated bugfix distributions'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
