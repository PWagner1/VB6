name: Apply validated continuation
on:
  push:
    branches: [feat/freestanding-win32-and-desktop-windows]
    paths: [.github/workflows/apply-continuation.yml]
permissions:
  contents: read
jobs:
  verify-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir /tmp/transfer
          cp .github/continuation-*.b64 /tmp/transfer/
          sha256sum /tmp/transfer/*
      - uses: actions/upload-artifact@v4
        with:
          name: source-transfer-integrity
          path: /tmp/transfer
          retention-days: 3
