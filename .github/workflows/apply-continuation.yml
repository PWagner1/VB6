name: Apply validated continuation
on:
  push:
    branches: [feat/freestanding-win32-and-desktop-windows]
    paths: [.github/workflows/apply-continuation.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate exact existing PR histories for testing
        run: |
          git config user.name 'VB6 integration'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge-base --is-ancestor 0b2f2db6e7f96983567e5dd9639f0eba21eec655 HEAD
          git fetch origin refs/pull/1/head refs/pull/8/head
          git merge --no-ff --no-edit 322eddbf9d096257f4d9bbce22d7d4fe4d200ccf
          git merge --no-ff --no-edit 0ff6817d77fcb7aaee1f4ed1be6ece520bef92c3
      - name: Verify and apply exact source delta
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root=pathlib.Path.cwd()
          expected=['fbfa0c11959624b9f52a8e50a5e5c19340e1fd359d4df178d9eef23ad9e32365','23ea2a578437b990d7673da929dc74d77162f1b5a76cf5b7a86eac0e7f838ad5','caa9b7fdf76dcbc9daabc7a3ed3b268abbed13e6e72c00f136c1354ee20b7e06','726d552de09627c94d6317e6a5f7dc09dddad8d8b57aa078fec352d32619b3ae']
          chunks=[]
          for i,checksum in enumerate(expected):
              chunk=(root/f'.github/continuation-{i}.b64').read_text().strip() if i<3 else ''.join((root/f'.github/continuation-tail-{j}.b64').read_text().strip() for j in range(4))
              assert hashlib.sha256(chunk.encode()).hexdigest()==checksum, f'Chunk {i} integrity: {len(chunk)} characters'
              chunks.append(chunk)
          raw=lzma.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='b406c789eff3d404700b61467a5b160062e2b1fb9fb9acbd5a4c7568c8c4bccc'
          delta=json.loads(raw)
          outputs=[]
          seen=set()
          digest=lambda value: hashlib.sha256(value).hexdigest() if value is not None else None
          for change in delta['changes']:
              rel=pathlib.PurePosixPath(change['path'])
              assert not rel.is_absolute() and '..' not in rel.parts and '.git' not in rel.parts
              path=root.joinpath(*rel.parts)
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              assert str(rel) not in seen
              seen.add(str(rel))
              old=path.read_bytes() if path.exists() else None
              assert digest(old)==change['before'], f'Concurrent edit: {rel}'
              if change.get('delete'):
                  new=None
              else:
                  lines=(old or b'').decode('utf-8').splitlines(keepends=True)
                  for start,end,text in reversed(change['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end]=[text]
                  new=''.join(lines).encode('utf-8')
              assert digest(new)==change['after'], f'Delta mismatch: {rel}'
              outputs.append((path,new))
          for path,new in outputs:
              if new is None: path.unlink()
              else:
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(new)
          path=root/'src/native/compiler.js'
          raw=path.read_bytes()
          assert digest(raw)=='7317e791316dec3fe90caad23b83649794646a7eadda7bb035f0ea236e5af27e'
          normalized=('\n'.join(line.rstrip() for line in raw.decode().splitlines()).rstrip()+'\n').encode()
          assert digest(normalized)=='1c5718572c5350e397de8da832c5ed254728edae15b47af47f2c1c5aa2919b16'
          path.write_bytes(normalized)
          print(f'Applied {len(outputs)} hash-verified source changes and compiler whitespace correction')
          PY
      - name: Build and test integrated sources
        run: |
          npm run build
          npm test
          node tools/win32-fixtures.mjs
          git diff --check
      - name: Publish source-only commit without overwriting concurrent work
        run: |
          mkdir -p /tmp/integrated-workflows
          cp .github/workflows/compatibility-oracle.yml .github/workflows/project-compatibility.yml /tmp/integrated-workflows/
          git restore --source="$GITHUB_SHA" --staged --worktree -- .github/workflows
          rm .github/continuation-*.b64
          git add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -p "$GITHUB_SHA" -m 'feat(native): owned Strings, fixed arrays, structured errors and recovered project integration')
          git diff --exit-code "$GITHUB_SHA" "$commit" -- .github/workflows
          git push origin "$commit":refs/heads/feat/freestanding-win32-and-desktop-windows
          echo "$commit" > /tmp/integrated-commit.txt
          git update-ref refs/heads/integrated-snapshot "$commit"
          git bundle create /tmp/vb6-integrated.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-source-history
          path: |
            /tmp/vb6-integrated.bundle
            /tmp/integrated-commit.txt
            /tmp/integrated-workflows/
          retention-days: 7
