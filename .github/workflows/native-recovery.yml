name: Native project recovery
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  recover:
    if: github.head_ref == 'feature/native-vb6-project-roundtrip'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture repository and interrupted upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p recovery/chunks
          git rev-parse HEAD > recovery/main-sha.txt
          git rev-parse HEAD^{tree} > recovery/main-tree.txt
          git archive HEAD > recovery/main.tar
          python - <<'PY'
          import base64, json, lzma, os, pathlib, urllib.request
          root = pathlib.Path('recovery')
          ids = ['4ddb80691de84ee6e15ce82fcb42bcf1832e58ff', '0802bf03a7ab1c3760dcfaafb0c49c5924e8316f', 'd9962ea6a2bfcfb238a0296ff4679e1d08ff7f58', '596cc3f21d53b48c84eb45d2f4ea85ed4ebcded4', 'c0c28ea1b30e08914d924a34517150616ce182e6']
          decoder = lzma.LZMADecompressor()
          with (root / 'recovered.partial').open('wb') as output:
              for i, sha in enumerate(ids):
                  req = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  value = json.load(urllib.request.urlopen(req))
                  data = base64.b64decode(value['content'])
                  (root / 'chunks' / str(i)).write_bytes(data)
                  output.write(decoder.decompress(data))
              print('Recovery stream complete:', decoder.eof)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-project-recovery
          path: recovery/
          retention-days: 7
