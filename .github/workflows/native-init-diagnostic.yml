name: Native initialization diagnostic
on:
  push:
    branches: [feat/freestanding-win32-and-desktop-windows]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/win32-fixtures.mjs
      - name: Diagnose only test-process runtime errors
        shell: pwsh
        run: |
          $file='tools/test-win32-aot.ps1'
          $text=Get-Content -Raw $file
          $text=$text.Replace('$processes.Add($p);return $p','$null=$p.Handle;$processes.Add($p);return $p')
          $before=@'
            [AotWindowsTest]::PostMessage([AotWindowsTest]::GetDlgItem($errorWindow,1),0xf5,[IntPtr]::Zero,[IntPtr]::Zero)|Out-Null
            Check ($fault[0]+' exits with documented error') ($p.WaitForExit(15000) -and $p.ExitCode -eq $fault[1])
          '@
          $after=@'
            foreach($c in [AotWindowsTest]::Children($errorWindow)){Write-Host ('ERROR CHILD '+$c+' '+[AotWindowsTest]::Class($c)+' '+[AotWindowsTest]::Text($c))}
            Write-Host ('ERROR WINDOW '+$errorWindow+' '+[AotWindowsTest]::Text($errorWindow))
            $posted=[AotWindowsTest]::PostMessage($errorWindow,0x10,[IntPtr]::Zero,[IntPtr]::Zero)
            $exited=$p.WaitForExit(15000)
            Write-Host ('FAULT '+$fault[0]+' close='+$posted+' exited='+$exited+' actual='+$p.ExitCode+' expected='+$fault[1])
            Check ($fault[0]+' exits with documented error') ($exited -and $p.ExitCode -eq $fault[1])
          '@
          if(-not $text.Contains($before)){throw 'Diagnostic source anchor mismatch'}
          $text=$text.Replace($before,$after)
          Set-Content -Encoding utf8 $file $text
          ./tools/test-win32-aot.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-error-diagnostic
          path: validation/win32/windows-runtime-results.json
          retention-days: 3
