name: Integrate numeric export with reviewed main
on:
  push:
    branches: [fix/win32-calculator-numeric-export]
    paths: ['.github/workflows/integrate-numeric-main.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/win32-calculator-numeric-export'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge reviewed native-project source without discarding changes
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-commit --no-ff e6c9dfc6732b9e99b8eb9756f9562784048fa114 || test -f .git/MERGE_HEAD
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          allowed={'src/exporter/runtime-payload.js'}
          for path in paths:
              if not (path.startswith('dist/') or path in allowed):
                  raise SystemExit('Unreviewed source conflict: '+path)
              subprocess.run(['git','checkout','--ours','--',path],check=True)
              subprocess.run(['git','add','--',path],check=True)
          PY
      - run: npm run build && npm test
      - name: Commit combined readable sources and deterministic distributions
        run: |
          git add -u
          git commit -m 'merge: preserve latest native-project and ZIP fixes with numeric compiler export'
          git push origin HEAD:fix/win32-calculator-numeric-export
      - uses: actions/upload-artifact@v4
        with:
          name: combined-numeric-source
          path: |
            src/
            tests/
            tools/
            docs/
            desktop/
            examples/
            package.json
            README.md
            LICENSE
          retention-days: 7
