name: Integrate Currency export and current editor
on:
  push:
    branches: [feat/win32-currency-export]
    paths: [.github/workflows/currency-final-integration.yml]
permissions:
  contents: write
concurrency:
  group: currency-final-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-currency-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge reviewed main and rebuild generated conflicts only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=523da10a94f3ed70708ff25d309921baaca7278e
          git merge-base --is-ancestor 48442f0b925dc3c136b1a0b74184f31f4d6263c2 "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0') if p]
          if not paths:raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):raise SystemExit('Source conflict requires explicit review: '+p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'merge: retain current editor fixes in verified Currency export' -m 'Preserve pinned main 523da10a94f3ed70708ff25d309921baaca7278e, including control-list/event-selection updates. Currency implementation and corrected comparison contract are retained. Rebuild generated conflicts from combined sources and rerun the full Node suite; final Windows/browser workflows validate the resulting head.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-currency-export
