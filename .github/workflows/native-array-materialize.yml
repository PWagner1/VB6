name: Materialize native array sources
on:
  push:
    branches: [feat/native-dynamic-arrays-integration]
    paths: ['tools/materialize-native-arrays.py', '.github/workflows/native-array-materialize.yml']
permissions:
  contents: write
concurrency:
  group: native-array-materialize
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'wieslawsoltes/VB6' && github.ref == 'refs/heads/feat/native-dynamic-arrays-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact verified source changes
        run: python tools/materialize-native-arrays.py
      - run: npm run build
      - run: npm test
      - run: node tools/win32-fixtures.mjs
      - name: Commit source and generated bundles, removing one-use transfer tooling
        run: |
          rm tools/materialize-native-arrays.py .github/workflows/native-array-materialize.yml
          git add src/native tests/win32-*.test.mjs tools dist docs .github/workflows/native-array-materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(native): integrate dynamic arrays, ByRef pin ownership and deterministic bundles'
          git push origin HEAD:refs/heads/feat/native-dynamic-arrays-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-array-materialization
          path: |
            validation/win32/
            src/native/
          retention-days: 7
