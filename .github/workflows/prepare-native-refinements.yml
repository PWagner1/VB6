name: Prepare native refinements
on:
  push:
    branches: [feat/freestanding-win32-and-desktop-windows]
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact reviewed patch
        run: |
          python - <<'PY'
          import base64,hashlib,zlib,pathlib,zipfile
          paths=[pathlib.Path('.github/transfer/refine-%d.b64'%n) for n in (1,2)]
          with zipfile.ZipFile('/tmp/native-transfer.zip','w') as out:
            for p in paths: out.write(p,p.name)
          data=''.join(p.read_text().strip() for p in paths)
          # Correct transfer transcription only; the decoded source must still match its reviewed hash.
          for before,after in [('aBgnYy8BM1','aBgnYy8aBM1'),('C3raZuZuAU','C3raZuAU'),('SbsJUlfAxa','SbsJUfaBxa')]:
            data=data.replace(before,after)
          patch=zlib.decompress(base64.b64decode(data,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='cdab2ec5fadd1242f6a54e562bbad0de44e39e1efde8e27c276de4fb39f0326b'
          pathlib.Path('/tmp/refinements.patch').write_bytes(patch)
          PY
          git apply --check /tmp/refinements.patch
          git apply /tmp/refinements.patch
      - name: Update previous target documentation without losing historical evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/WINDOWS-BUILDS.md'); s=p.read_text()
          changes={
            'There are two **different** Windows targets. Both build pipelines and the modern host are maintained in JavaScript.':'There are three **different** Windows targets. The compiler/linker, build pipelines and modern host are maintained in JavaScript. The new [freestanding AOT target](WIN32-AOT.md) closes the no-extraction boundary for its supported typed subset; it is not full VB6 or a WebGPU renderer.',
            '| Modern portable |':'| Freestanding AOT | One PE32/x86 EXE; no extraction | Windows system DLLs; no bundled engine or VB6 runtime | Native controls and GDI; experimental typed subset |\n| Modern portable |',
            '**Not a no-extraction implementation:**':'**Electron target is not a no-extraction implementation:**',
            'npm --prefix desktop install':'npm --prefix desktop ci',
            'Existing IDE docking behavior is not a claim of complete detached-tool-window parity.':'The existing live-DOM detachment host now uses reserved native desktop windows for tool groups, documents and modeless tools. Properties/code detachment, original editor identity, OS-close restoration, MDI-only restoration and direct child-IPC rejection are tested on x64 and ARM64. This is not a claim of pixel-exact native IDE parity.',
            'ARM64 is a build target, not a claim of execution on ARM64 hardware.':'The Win32 AOT and ARM64 workflow now additionally verifies native ARM64 process architecture and launches both staged desktop targets and the isolated ARM64 portable IDE. These hosted runs reported Canvas2D fallback, not hardware-WebGPU certification.'
          }
          for old,new in changes.items():
            assert s.count(old)==1,old
            s=s.replace(old,new)
          p.write_text(s)
          p=Path('docs/NATIVE-VALIDATION.md')
          s=p.read_text()
          p.write_text('> Historical validation for the original portable/classic target work. See [Win32 AOT and desktop windows](WIN32-AOT.md) and PR #9 for the later no-extraction target, real MDI/control HWNDs and ARM64 execution evidence.\n\n'+s)
          PY
      - run: npm run build
      - run: npm test > /tmp/native-refinement-tests.log
      - name: Commit verified source and regenerated distributions only
        run: |
          test "$(git ls-remote origin refs/heads/feat/freestanding-win32-and-desktop-windows | cut -f1)" = "$GITHUB_SHA"
          git rm .github/transfer/refine-1.b64 .github/transfer/refine-2.b64
          git add README.md docs examples/native src/native tests tools package.json dist
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: guard native initialization and scope; add native Frame hierarchy and serverless compiler SDK'
          git push origin HEAD:refs/heads/feat/freestanding-win32-and-desktop-windows
          git rev-parse HEAD > /tmp/native-refinement-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-refinement-validation
          path: |
            /tmp/native-refinement-tests.log
            /tmp/native-refinement-commit.txt
            /tmp/native-transfer.zip
          retention-days: 3
