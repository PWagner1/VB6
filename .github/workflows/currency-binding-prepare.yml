name: Prepare reviewed native binding changes
on:
  push:
    branches: [feat/win32-currency-export]
    paths: [.github/workflows/currency-binding-prepare.yml]
permissions:
  contents: write
concurrency:
  group: currency-binding-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-currency-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only the reviewed compiler and CLI edits with before/after fingerprints
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor 85b210f6100fa01f32c0dc55d693d56e4b6d9909 HEAD
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          def edit(path,before,after,replacements):
              p=Path(path)
              assert sha(p.read_bytes())==before, 'Unexpected source: '+path
              s=p.read_text()
              for old,new in replacements:
                  assert s.count(old)==1, 'Unexpected replacement count: '+path
                  s=s.replace(old,new)
              assert sha(s.encode())==after, 'Incorrect result: '+path
              p.write_text(s)
          edit('src/native/compiler.js','529e598785d4f027aefce3a4da032655e0381ab78feb8f09efaf1c05f78c8556','698add03b407500c0e406b272575e56f388639b45b3aa6b394314ae7a249bb2a',[
              ("import {X86} from './x86.js';\n", "import {X86} from './x86.js';\nimport {nativeBindingMethods} from './bindings.js';\n"),
              ("    if (node.kind !== 'id') return undefined; const name = key(node.name), c = this.context;\n    for (const map of [c?.proc.constantBindings, c?.module.module.constantBindings, c?.module.module.importedConstantBindings, c?.module.module.globalEnumMembers]) if (map?.has(name)) return map.get(name);\n    return CONSTANTS[name];", "    const binding=this.nativeConstant(node);if(binding)return binding.value;\n    return node.kind==='id'&&!this.variable(node)?CONSTANTS[key(node.name)]:undefined;"),
              ("  type(node) {\n", "  type(node) {\n    const bound=this.nativeConstant(node);if(bound)return bound.type;\n"),
              ("      const proc=this.resolveProcedure(node.callee);if(proc?.proc?.kind==='function')return key(proc.proc.returnType);", "      const result=this.nativeFunctionType(node);if(result)return result;"),
              ("    if(node.kind==='id'){const proc=this.resolveProcedure(node);if(proc?.proc?.kind==='function')return key(proc.proc.returnType);}", "    if(node.kind==='id'||node.kind==='member'){const result=this.nativeFunctionType(node);if(result)return result;}"),
              ("    if (!node) this.fail('Missing expression'); const x = this.x;\n", "    if (!node) this.fail('Missing expression'); const x = this.x;\n    const bound=this.nativeConstant(node);if(bound)return this.emitNativeConstant(bound);\n"),
              ("Object.assign(NativeCompiler.prototype,nativeStorageMethods", "Object.assign(NativeCompiler.prototype,nativeBindingMethods,nativeStorageMethods")
          ])
          edit('tools/build-win32.mjs','48bdaa7b1e1f4ac46195f05d4afe7ba67f0535f3630dcac81f6292b9a1a0b77d','2041c4d5d22d5e4aef116e8a8f3bd33ec3bcf6767773e738c689f5945dbee74e',[
              ('Single/Double, Strings and typed arrays','Single/Double, Currency, Strings and typed arrays')
          ])
          edit('tests/win32-cli-help.test.mjs','dead9a8fb868b182280f52e81f3e0c5fe31bc95f7f22ae90a43286071d8a8d82','e589ac6e4ae9012098c2d876a7cfbd2dfcc5d3ca9d4b971e3e2acdf486d0dd77',[
              ('  assert.match(output, /Strings and typed arrays/);','  assert.match(output, /Currency/);\n  assert.match(output, /Strings and typed arrays/);')
          ])
          edit('tools/browser-native-build-tests.py','36e6204d40b96bda0963c9392e84fbc438d2c6db9335f829b22b688220b7ba47','7d57cfb4209a414e3039cc928935f794ee9edad2794661ee70541240005b6291',[
              ("            fixtures.append((currency_dir, 'AotCurrency'))", "            fixtures.append((currency_dir, 'AotCurrency'))\n            if (currency_dir / 'AotCurrencyBindings.vb6web').exists():\n                fixtures.append((currency_dir, 'AotCurrencyBindings'))")
          ])
          expected={
              'src/native/bindings.js':'f021b581bad4edc26a77ce947e741a99e1902dc62ed42922e5c773c484ba7c12',
              'tests/win32-bindings.test.mjs':'96f866efdd1b149f56eafdfd817c507fe133b065b13b0bf82fda864bf4fad7a0',
              'tests/fixtures/native/currency-abi.c':'452eb63f1fc0899777a9eb71e66615e52fbb513dc73c9765a6fff2f9c48cabef',
              'tests/fixtures/native/currency-abi.def':'91561a4266c457de94d21c21eae65cbfaabd0aedf1eefbf982953c82a2a09f80',
              'tools/win32-bindings-fixtures.mjs':'a605134ac5919175902349e61e115f2ceab110fb7f6b13f39806ced96fab0bbb',
              'tools/test-win32-bindings.ps1':'747ac6d4221f3b584238b92442d5a2058749991a8c514da52f57a6f967d1cc1c',
              'tools/test-win32-currency.ps1':'1899a73aaf5ad73309258695cbc11080a9d212d3b6923a23ac6ef1dac87ba469',
              'docs/WIN32-BINDINGS.md':'ec2bdaf75eebdeb48a7adb4a428cdec1bf63d11faddeff610b56b80c8821ffcd'
          }
          for p,h in expected.items():
              assert sha(Path(p).read_bytes())==h, 'Transferred source mismatch: '+p
          print('All source fingerprints verified')
          PY
          npm run build
          npm test
          node tools/win32-bindings-fixtures.mjs
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/native/compiler.js tools/build-win32.mjs tests/win32-cli-help.test.mjs tools/browser-native-build-tests.py dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
          git commit -m 'fix(native): preserve constant declaration types and DLL return signatures' -m 'Apply reviewed fingerprint-checked source, preserve Currency and floating results, regenerate combined bundles, and validate the complete Node suite. Independent Windows ABI execution remains a separate required job.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-currency-export
