name: Integrate DAO compatibility
on:
  push:
    branches: [feat/data-dao-compat]
    paths: [.github/workflows/dao-compat-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and apply reviewed source delta
        run: |
          python - <<'PY'
          import base64,hashlib,pathlib,subprocess
          base='6d587b674f9116312661d3d474ff8833e3ebecbf'
          paths=['docs/DATA-SOURCES.md','src/data/collection.js','src/data/common.js','src/data/connection.js','src/data/context.js','src/data/criteria.js','src/data/dao-recordset.js','src/data/dao.js','src/data/defaults.js','src/data/recordset.js','src/data/sql-parameters.js','src/data/sqlite.js','src/language/lexer.js','src/runtime/vm.js','tests/data-dao.test.mjs','tests/data-parity.test.mjs','tests/data-sources.test.mjs','tests/data-vm.test.mjs','tests/fixtures/dao-compat.bas','tools/browser-data-recordsets.py']
          dictionary=b''
          for path in paths:
              result=subprocess.run(['git','show',base+':'+path],capture_output=True)
              if result.returncode==0: dictionary+=result.stdout
          assert hashlib.sha256(dictionary).hexdigest()=='7e7a24e222c116c80f17ad83b78a1d3b9aad2acac916a328a5c342b2f32f071b'
          pathlib.Path('/tmp/dao-dictionary').write_bytes(dictionary)
          encoded=''.join(pathlib.Path(f'.dao-transfer/part{i}.txt').read_text().strip() for i in (1,2,3))
          pathlib.Path('/tmp/dao-source.zst').write_bytes(base64.b64decode(encoded,validate=True))
          subprocess.run(['zstd','-d','--patch-from=/tmp/dao-dictionary','/tmp/dao-source.zst','-o','/tmp/dao-source.patch'],check=True)
          patch=pathlib.Path('/tmp/dao-source.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest()=='eb4765a00f4c807363176296d41ed9fe3df87e8a942afa8831dee88439ac4170'
          subprocess.run(['git','apply','--3way','--index','/tmp/dao-source.patch'],check=True)
          PY
      - name: Build and validate the combined current application
        run: |
          set -euo pipefail
          mkdir -p /tmp/dao-result
          npm run build
          npm test | tee /tmp/dao-result/node-tests.log
          git diff --exit-code HEAD -- .github/workflows
      - name: Publish validated source and reproducible bundles
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/data-dao-compat | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .dao-transfer
          git add -A
          git commit -m 'feat(data): DAO workspaces, typed QueryDefs, catalogs and explicit copy-buffer editing'
          git push origin HEAD:refs/heads/feat/data-dao-compat
          git rev-parse HEAD > /tmp/dao-result/head.txt
          git archive HEAD | gzip > /tmp/dao-result/source.tar.gz
          git bundle create /tmp/dao-result/repository.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao-integration
          path: /tmp/dao-result
          retention-days: 7
