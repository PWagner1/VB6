name: Rebuild integrated numeric distributions
on:
  push:
    branches: [fix/win32-calculator-numeric-export]
    paths: ['.github/workflows/rebuild-numeric-bundles.yml']
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref == 'refs/heads/fix/win32-calculator-numeric-export'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build && npm test
      - name: Commit deterministic bundles without changing workflows
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add -u dist src/exporter/runtime-payload.js
          git diff --cached --quiet || git commit -m 'build: regenerate native numeric SDK and IDE with latest agent access'
          git push origin HEAD:fix/win32-calculator-numeric-export
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-calculator-source
          path: |
            src/
            tests/
            tools/
            docs/
            desktop/
            examples/
            package.json
            README.md
            LICENSE
          retention-days: 7
