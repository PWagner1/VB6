name: Integrate reviewed native workspace source
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: native-workspace-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.head_ref == 'feat/native-workspace-interop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify reviewed delta and preserve concurrent source edits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/native-integration
          git bundle create /tmp/native-integration/baseline.bundle HEAD refs/remotes/origin/main
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root=pathlib.Path('/tmp/native-integration')
          chunks=[]
          for sha in ['5ed9b580f2a07eae6576f86cee6fb88fd7887e6f','a3107c214fad919a870b5534c817f4f166603284','da8aceff3539d35ce259303a949045b22cbe75f2','28d2a68105066a67c92c8e9ff12b68946baec6f6','e1c980248c7949299d89cd30c2dde848076457a7']:
              req=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              chunks.append(base64.b64decode(json.load(urllib.request.urlopen(req))['content']))
          data=b''.join(chunks)
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert digest(data)=='ef1f3843960469590a2b0fb0658174188c5d38533d3b8f3c0127f9bc14e568c9'
          delta=json.loads(lzma.decompress(data))
          assert delta['base']=='368fac5d9a9bad449fdcb5e49cc4cc1194ba88f0'
          allowed={'README.md','docs/NATIVE-PROJECTS.md','docs/NATIVE-WORKSPACE-INTEROP.md','package.json','src/controls/adapters.js','src/controls/controls.js','src/designer/designer.js','src/ide/documents.js','src/ide/main.js','src/ide/native-projects.js','src/ide/native-workspace.js','src/project/formats.js','src/project/native-directory.js','src/project/native-project.js','src/project/native-save-recovery.js','src/project/native-window-state.js','src/project/zip.js','src/runtime/automation-wire.js','src/runtime/automation.js','src/runtime/entry.js','src/runtime/host.js','src/runtime/vm.js','tests/helpers/native-memory-directory.mjs','tests/native-automation.test.mjs','tests/native-control-adapters.test.mjs','tests/native-save-recovery.test.mjs','tests/native-snapshot.test.mjs','tests/native-workspace.test.mjs','tests/native-zip-encoding.test.mjs','tools/interop/AutomationHost.cs','tools/interop/automation-host.ps1','tools/interop/native-automation.mjs','tools/interop/test-activex.mjs','tools/interop/test-native.mjs','tools/native-project-browser-tests.py','tools/native-snapshot.mjs','tools/verify-classic-roundtrip.mjs'}
          assert {f['path'] for f in delta['files']}==allowed
          outputs=[]; conflicts=[]; report=[]
          for item in delta['files']:
              path=pathlib.Path(item['path'])
              current=path.read_bytes() if path.exists() else None
              base=subprocess.run(['git','show',delta['base']+':'+str(path)],capture_output=True)
              original=base.stdout if base.returncode==0 else None
              assert (digest(original) if original is not None else None)==item['before'], str(path)+' base digest'
              if 'text' in item: text=item['text']
              else:
                  text=original.decode('utf-8')
                  for start,end,replacement in sorted(item['edits'],reverse=True):
                      assert 0<=start<=end<=len(text)
                      text=text[:start]+replacement+text[end:]
              after=text.encode('utf-8'); assert digest(after)==item['after'], str(path)+' reviewed digest'
              if current==after: continue
              output=after
              if current!=original:
                  if current is None or original is None:
                      conflicts.append(str(path)); continue
                  temp=root/'merge'/str(path); temp.parent.mkdir(parents=True,exist_ok=True)
                  names=[str(temp)+s for s in ['.current','.base','.reviewed']]
                  for name,value in zip(names,[current,original,after]):pathlib.Path(name).write_bytes(value)
                  merged=subprocess.run(['git','merge-file','-p',*names],capture_output=True)
                  pathlib.Path(str(temp)+'.result').write_bytes(merged.stdout)
                  if merged.returncode:
                      conflicts.append(str(path)); continue
                  output=merged.stdout
              outputs.append((path,output)); report.append({'path':str(path),'reviewed':digest(after),'integrated':digest(output),'mergedConcurrentEdit':current!=original})
          (root/'integration.json').write_text(json.dumps({'files':report,'conflicts':conflicts},indent=2))
          assert not conflicts, 'Manual three-way review required: '+', '.join(conflicts)
          for path,output in outputs:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(output)
          print('Applied',len(outputs),'reviewed files; concurrent edits preserved with conflict-checked three-way merges')
          PY
      - name: Build and validate integrated application
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/native-integration/build.log
          npm run test:project-files 2>&1 | tee /tmp/native-integration/project-tests.log
          npm run test:interop 2>&1 | tee /tmp/native-integration/interop-tests.log
          npm test 2>&1 | tee /tmp/native-integration/all-tests.log
      - name: Commit source and generated distributions without changing workflows
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src tests tools docs dist README.md package.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: restore native workspaces, recover saves and add opt-in Automation interoperability'
          fi
          git bundle create /tmp/native-integration/integrated.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/native-integration/head.txt
          git push origin HEAD:refs/heads/feat/native-workspace-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-workspace-integration
          path: /tmp/native-integration/
          retention-days: 7
