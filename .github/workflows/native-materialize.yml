name: Materialize native project source
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'feature/native-vb6-project-roundtrip' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recover hash-verified source and integrate the recorded baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git merge --no-edit bc051d446699adb1da90c41ee0c479bbe1266ffa
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          ids = ['4ddb80691de84ee6e15ce82fcb42bcf1832e58ff', '0802bf03a7ab1c3760dcfaafb0c49c5924e8316f', 'd9962ea6a2bfcfb238a0296ff4679e1d08ff7f58', '596cc3f21d53b48c84eb45d2f4ea85ed4ebcded4', 'c0c28ea1b30e08914d924a34517150616ce182e6']
          decoder = lzma.LZMADecompressor(); text = b''
          for sha in ids:
              request = urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN']})
              data = json.load(urllib.request.urlopen(request))
              text += decoder.decompress(base64.b64decode(data['content']))
          text = text.decode('utf-8'); position = text.index('[', text.index('"files"')) + 1
          for index in range(9):
              item, end = json.JSONDecoder().raw_decode(text[position:]); position += end + 1
              path = pathlib.Path(item['path'])
              assert str(path).startswith(('src/project/', 'src/ide/')) and '..' not in path.parts
              if 'text' in item: output = item['text']
              else:
                  data = path.read_bytes()
                  if hashlib.sha256(data).hexdigest() == item['sha256']: continue
                  assert hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest() == item['before'], str(path)
                  output = data.decode('utf-8')
                  for start, end, replacement in sorted(item['edits'], reverse=True): output = output[:start] + replacement + output[end:]
              assert hashlib.sha256(output.encode()).hexdigest() == item['sha256'], str(path)
              path.write_bytes(output.encode()); print('Recovered', path)
          PY
          npm run build
          npm test
          git add src/project src/ide/native-projects.js dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          if ! git diff --cached --quiet; then git commit -m 'feat: preserve native project and group files with lossless source overlays and safe directory I/O'; fi
          git push origin HEAD:feature/native-vb6-project-roundtrip
