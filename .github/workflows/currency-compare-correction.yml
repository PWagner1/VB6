name: Correct Currency comparison contract
on:
  push:
    branches: [feat/win32-currency-export]
    paths: [.github/workflows/currency-compare-correction.yml]
permissions:
  contents: write
jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-currency-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve implementation and correct the documented comparison tests
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          from pathlib import Path
          p=Path.cwd()
          f=p/'tools/win32-currency-fixtures.mjs'
          s=f.read_text()
          old="check('1.25@ > 1.24999 And 1.24999 < 1.25@','mixed comparison preserves sub-Currency precision and order');"
          assert s.count(old)==1
          s=s.replace(old,"""// The documented VB comparison rule converts Single/Double to Currency first.
            // Keep rounding equality distinct from ordinary ordered comparisons.
            check('1.25@ = 1.24999 And 1.24999 = 1.25@','mixed comparison rounds floating operands to Currency in either order');""")
          old="check('1.25@ <> 1.25001 And 1.25001 <> 1.25@','mixed equality does not round the Double operand');"
          assert s.count(old)==1
          s=s.replace(old,"""check('Not (1.25@ <> 1.25001) And Not (1.25001 <> 1.25@)','mixed inequality respects Currency rounding');
            check('1.25@ > 1.2498 And 1.2498 < 1.25@','mixed strictly ordered values preserve operand order');
            check('1.25@ < 1.2502 And 1.2502 > 1.25@','mixed strictly ordered values preserve reverse operand order');
            check('1.25@ <= 1.24999 And 1.24999 >= 1.25@','mixed inclusive comparisons retain rounded equality');
            check('1.25@ >= 1.25001 And 1.25001 <= 1.25@','reverse mixed inclusive comparisons retain rounded equality');
            check('1.0001@ = CSng(1.0001) And CSng(1.0001) = 1.0001@','Single comparison converts to Currency');
            check('-922337203685477.5808@ < 922337203685477.5807@ And 922337203685477.5807@ > -922337203685477.5808@','comparison across complete signed Currency range');
            check('CyCompare(1.25@, 1.24999) = 1 And CyCompare(1.25@, 1.25001) = 1','native OleAut32 oracle confirms rounded mixed equality');
            check('CyCompare(1.25@, 1.2498) = 2 And CyCompare(1.25@, 1.2502) = 0','native OleAut32 oracle confirms mixed comparison direction');""")
          assert s.count('Private Declare Function CyRound Lib')==1
          s=s.replace('Private Declare Function CyRound Lib','Private Declare Function CyCompare Lib "oleaut32" Alias "VarCyCmpR8" (ByVal a As Currency, ByVal b As Double) As Long\nPrivate Declare Function CyRound Lib')
          f.write_text(s)
          f=p/'docs/WIN32-CURRENCY.md';s=f.read_text()
          old='uses `VarCyCmpR8`, so the floating operand is not first rounded to four decimals.'
          assert s.count(old)==1
          s=s.replace(old,"""uses `VarCyCmpR8`: the floating operand is converted to Currency before comparison,
          matching VB's documented comparison rule. Values such as `1.24999` and `1.25001`
          therefore both compare equal to `1.25@`; the sub-four-decimal difference is lost.
          Ordinary ordering is retained when the converted Currency values differ, and
          reversing operands reverses that ordering. This is distinct from promoting the
          Currency operand to Double.""").replace('- Comparison without premature rounding:', '- Currency/Single/Double comparison rules: https://learn.microsoft.com/en-us/office/vba/language/reference/user-interface-help/comparison-operators\n- Native comparison API:')
          s += """\n### Comparison test correction\n\nThe initial native Windows run reached assertion 30, where the test incorrectly\nexpected a sub-four-decimal difference to remain after mixed comparison. That\nexpectation contradicted Microsoft's documented conversion rule. The test now\nchecks rounded equality, strict and inclusive ordering in both operand orders,\nSingle conversion and the complete signed range, plus direct OleAut32 comparison\ncalls from the emitted x86 program. The compiler's existing `VarCyCmpR8` lowering\nwas retained; no floating-comparison assertion was disabled.\n"""
          f.write_text(s)
          f=p/'tests/win32-currency.test.mjs';s=f.read_text()
          assert 'mixed Currency comparisons retain rounding' not in s
          s += r'''
          // Native Windows is the behavioral oracle; these regressions keep the fixture
          // aligned with the documented VB conversion contract, not an IEEE comparison.
          test('mixed Currency comparisons retain rounding, direction and real API-oracle assertions',()=>{
            const {project,checks}=currencyFixture(),source=project.modules[0].code;
            assert.match(source,/1\.25@ = 1\.24999 And 1\.24999 = 1\.25@/);
            assert.match(source,/1\.25@ > 1\.2498 And 1\.2498 < 1\.25@/);
            assert.match(source,/1\.25@ < 1\.2502 And 1\.2502 > 1\.25@/);
            assert.match(source,/Alias "VarCyCmpR8"/);
            assert.ok(checks.some(label=>label.includes('complete signed Currency range')));
            const result=compileWin32(project);
            assert.ok(result.bytes.length>0);
          });
          '''
          f.write_text(s)
          PY
      - run: npm run build
      - run: npm test
      - name: Commit reviewed test and documentation correction
        run: |
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add tools/win32-currency-fixtures.mjs tests/win32-currency.test.mjs docs/WIN32-CURRENCY.md dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git diff --cached --check
          git commit -m 'test: verify documented Currency mixed comparison conversion on Windows' -m 'The first Windows run exposed an incorrect test assumption, not a reason to switch to IEEE comparison. Microsoft documents conversion to Currency and loss below .0001. Retain VarCyCmpR8 lowering, assert rounded equality and both ordering directions, full signed range, and direct x86 OleAut32 oracle calls. Correct documentation and preserve all existing execution checks.'
          git push origin HEAD:refs/heads/feat/win32-currency-export
