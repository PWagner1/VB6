name: Integrate Currency and current main
on:
  push:
    branches: [feat/win32-currency-export]
    paths: [.github/workflows/currency-integrate.yml]
permissions:
  contents: write
concurrency:
  group: currency-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-currency-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile pinned main and regenerate generated conflicts only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=48442f0b925dc3c136b1a0b74184f31f4d6263c2
          git merge-base --is-ancestor a073a87fbe4583fc54b20fcc76bf62fb75ffdc0f "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=[p for p in subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0') if p]
          if not paths:raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):raise SystemExit('Source conflict requires explicit review: '+p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'merge: retain current DAO/designer sources in native Currency export' -m 'Merge pinned main 48442f0b925dc3c136b1a0b74184f31f4d6263c2 without replacing source changes. Rebuild generated bundles and run the complete integrated Node suite. Windows Currency execution is verified separately.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-currency-export
