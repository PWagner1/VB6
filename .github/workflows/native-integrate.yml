name: Native project integration snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'feature/native-vb6-project-roundtrip' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Capture repository and verify interrupted delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/native-review
          git fetch origin main
          git bundle create /tmp/native-review/repository.bundle HEAD refs/remotes/origin/main
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          chunks=[]
          for sha in ['f3fec04c20062020fad596e3665190fd2cae8d9d','3faf33420bed7ac6bcc88901227a9468ad1f07ee','c163155bbdf1fdf4f3a0d1a6397771a55be2e5b2']:
              request=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              chunks.append(base64.b64decode(json.load(urllib.request.urlopen(request))['content']))
          data=b''.join(chunks)
          assert hashlib.sha256(data).hexdigest()=='d06868956fdf5f6601bd2a1635356f1410ecb6c431e0fe65db8e00e34fd95f20'
          pathlib.Path('/tmp/native-review/delta.json').write_bytes(lzma.decompress(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-project-review
          path: /tmp/native-review/
          retention-days: 7
