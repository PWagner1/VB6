name: Refresh input-fix distributions
on:
  push:
    branches:
      - fix/designer-nonvisual-selection
      - fix/live-editor-control-list
      - fix/editor-event-selection
      - fix/form-keyboard-mouse-input
    paths:
      - src/**
      - tools/**
      - tests/**
      - .github/workflows/refresh-input-distributions.yml
permissions:
  contents: write
concurrency:
  group: refresh-input-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'wieslawsoltes/VB6'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build && npm test
      - name: Commit only regenerated distributions
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          case "$BRANCH" in
            fix/designer-nonvisual-selection|fix/live-editor-control-list|fix/editor-event-selection|fix/form-keyboard-mouse-input) ;;
            *) exit 1 ;;
          esac
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: regenerate distributions from tested input-fix source'
          git push origin "HEAD:refs/heads/$BRANCH"
