name: Finalize native recovery protection
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: native-interop-property-correction
  cancel-in-progress: false
jobs:
  correction:
    if: github.head_ref == 'feat/native-workspace-interop' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preserve current baseline and apply verified recovery regression fix
        run: |
          mkdir -p /tmp/interop-final
          git fetch origin main
          git bundle create /tmp/interop-final/baseline.bundle HEAD refs/remotes/origin/main
          git rev-parse origin/main > /tmp/interop-final/main.txt
          python - <<'PY'
          import hashlib,pathlib
          patches=[('src/ide/native-workspace.js','311737182d7b0a29fba4cc755df9d78e711ddd76798e0a6f3b085ab058c433d9','915216e9d7e7dd86d1a3646d01e34543d79a87328f0ddc82059d33d27d1f5a93',"if(!action)return false;const result=await recoverNativeDirectory(handle,{action});","if(!action)return false;\n    if(ide.runState!=='design')throw new Error('Stop execution before recovering a native folder');\n    // Disk recovery invalidates the saved baseline even when memory did not change.\n    // Invalidate before writes so partial/failed recovery also preserves discard protection.\n    ide.savedJSON=null;ide.markDirty();\n    const result=await recoverNativeDirectory(handle,{action});"),('tools/native-project-browser-tests.py','4f43107aaaad97c0c49dc7f0e25b1473479a7a42d23dcc2f818f91ded4c32ea5','209615f8970f10b244b78af1003e60055838ba1f86c7298747c12211064f078b',"self.assertEqual(bytes(actual),FIXTURE['app/App.vbp']);self.assertTrue(self.js('vb6Studio.dirty'))","self.assertEqual(bytes(actual),FIXTURE['app/App.vbp']);self.assertTrue(self.js('vb6Studio.dirty'))\n        # A subsequent no-op dirty recalculation must not revalidate the old disk snapshot.\n        self.js('vb6Studio.markDirty()');self.assertTrue(self.js('vb6Studio.dirty'))")]
          outputs=[]
          for path,before,after,old,new in patches:
              p=pathlib.Path(path);data=p.read_bytes();digest=hashlib.sha256(data).hexdigest()
              if digest==after:continue
              assert digest==before,path+' changed concurrently'
              text=data.decode('utf-8');assert text.count(old)==1
              data=text.replace(old,new).encode('utf-8');assert hashlib.sha256(data).hexdigest()==after
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Full regression and reproducible build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/interop-final/build.log
          npm test 2>&1 | tee /tmp/interop-final/tests.log
      - name: Commit the recovery fix without changing workflows
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/ide/native-workspace.js tools/native-project-browser-tests.py dist
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'fix: invalidate saved baseline before native folder recovery'; fi
          git bundle create /tmp/interop-final/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/interop-final/head.txt
          git push origin HEAD:refs/heads/feat/native-workspace-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-recovery-finalization
          path: /tmp/interop-final/
          retention-days: 7
