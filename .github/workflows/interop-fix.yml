name: Finalize native workspace integration
on:
  push:
    branches: [feat/native-workspace-interop]
permissions:
  contents: write
concurrency:
  group: native-interop-property-correction
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/feat/native-workspace-interop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Integrate audited main without replacing concurrent features
        run: |
          set -euo pipefail
          mkdir -p /tmp/interop-final
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git fetch origin main
          git bundle create /tmp/interop-final/baseline.bundle HEAD refs/remotes/origin/main
          if git merge-base --is-ancestor 48442f0b925dc3c136b1a0b74184f31f4d6263c2 HEAD; then exit 0; fi
          git merge --no-commit --no-ff 48442f0b925dc3c136b1a0b74184f31f4d6263c2 || true
          test -f .git/MERGE_HEAD
          python - <<'PY'
          import hashlib,pathlib,subprocess
          conflicts=subprocess.check_output(['git','diff','--name-only','--diff-filter=U']).decode().splitlines()
          source={'src/runtime/vm.js','src/designer/designer.js'}
          assert all(p in source or p.startswith('dist/') or p=='src/exporter/runtime-payload.js' for p in conflicts),conflicts
          fixes=[('src/runtime/vm.js','8de611e192b5803b4fb228a0ac2e488a03e047b63ec3a21d538c3379acd45e66','c72e037ee988cf38993ebb106746aa3653d35459065d21457b1b1b2334a38509',[("import {DebugEvaluationSession} from './debug-evaluation.js';","import {DebugEvaluationSession} from './debug-evaluation.js';\nimport {hasDataDefault} from '../data/defaults.js';"),("    if(value?.__control)return value.defaultValue();","    if(value?.__control)return value.defaultValue();\n    if(hasDataDefault(value))return this.defaultValue(value.Value,depth+1);"),("if(value?.__control)return value.defaultRef();","if(value?.__control)return value.defaultRef();if(hasDataDefault(value))return new Ref(()=>value.Value,v=>{value.Value=v;});")]),('src/designer/designer.js','e99cb4d646c33689da4b69ca69f8da3bb09754026ef919a4db9871721d9bca45','e21681e9930ea8158ad91e4c0748105a976a8f526fdd7982cc9a11dbaa16f0c6',[("this.formView.controls.forEach((c,i)=>c.node.style.zIndex=String(i+1));","this.formView.controls.forEach((c,i)=>{c.node.style.zIndex=String(i+1);c.node.style.pointerEvents='auto';});")])]
          for p,before,after,replacements in fixes:
              assert p in conflicts,p+' unexpected merge state'
              data=subprocess.check_output(['git','show','HEAD:'+p]);assert hashlib.sha256(data).hexdigest()==before
              text=data.decode('utf-8')
              for old,new in replacements:
                  assert text.count(old)==1;text=text.replace(old,new)
              data=text.encode('utf-8');assert hashlib.sha256(data).hexdigest()==after
              pathlib.Path(p).write_bytes(data)
          generated=[p for p in conflicts if p not in source]
          if generated:subprocess.run(['git','checkout','--ours','--',*generated],check=True)
          PY
      - name: Rebuild distributions from merged sources and run every Node test
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/interop-final/build.log
          npm run test:project-files 2>&1 | tee /tmp/interop-final/project-tests.log
          npm run test:interop 2>&1 | tee /tmp/interop-final/interop-tests.log
          npm test 2>&1 | tee /tmp/interop-final/tests.log
      - name: Publish validated integration without workflow changes
        run: |
          set -euo pipefail
          git add src tests tools docs dist README.md package.json
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          if test -f .git/MERGE_HEAD; then git commit -m 'Merge current main into native workspace interoperability; preserve data defaults and designer selection'; fi
          git bundle create /tmp/interop-final/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/interop-final/head.txt
          git push origin HEAD:refs/heads/feat/native-workspace-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-workspace-final-integration
          path: /tmp/interop-final/
          retention-days: 7
