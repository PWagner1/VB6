name: Finalize native recovery protection
on:
  push:
    branches: [feat/native-workspace-interop]
permissions:
  contents: write
concurrency:
  group: native-interop-property-correction
  cancel-in-progress: false
jobs:
  correction:
    if: github.ref == 'refs/heads/feat/native-workspace-interop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture current main and apply exact recovery regression correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/interop-final
          git fetch origin main
          git bundle create /tmp/interop-final/baseline.bundle HEAD refs/remotes/origin/main
          git rev-parse origin/main > /tmp/interop-final/main.txt
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          sha='3a3f0db2ee24eb06648bc22017df5386d78f060f'
          req=urllib.request.Request('https://api.github.com/repos/wieslawsoltes/VB6/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
          data=base64.b64decode(json.load(urllib.request.urlopen(req))['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          files=json.loads(data);assert {f['path'] for f in files}=={'src/ide/native-workspace.js','tools/native-project-browser-tests.py'}
          digest=lambda b:hashlib.sha256(b).hexdigest()
          outputs=[]
          for f in files:
              p=pathlib.Path(f['path']);before=p.read_bytes()
              if digest(before)==f['after']:continue
              assert digest(before)==f['before'],str(p)+' changed concurrently'
              text=before.decode('utf-8')
              for old,new in f['replacements']:
                  assert text.count(old)==1;text=text.replace(old,new)
              output=text.encode('utf-8');assert digest(output)==f['after'];outputs.append((p,output))
          for p,output in outputs:p.write_bytes(output)
          PY
      - name: Full regression and reproducible build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee /tmp/interop-final/build.log
          npm test 2>&1 | tee /tmp/interop-final/tests.log
      - name: Commit application changes without modifying workflows
        run: |
          set -euo pipefail
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add src/ide/native-workspace.js tools/native-project-browser-tests.py dist
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'fix: invalidate saved baseline before native folder recovery'; fi
          git bundle create /tmp/interop-final/repository.bundle HEAD refs/remotes/origin/main
          git rev-parse HEAD > /tmp/interop-final/head.txt
          git push origin HEAD:refs/heads/feat/native-workspace-interop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-recovery-finalization
          path: /tmp/interop-final/
          retention-days: 7
