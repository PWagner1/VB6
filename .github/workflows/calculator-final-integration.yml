name: Reconcile Calculator export
on:
  push:
    branches: [fix/win32-calculator-numeric-export]
    paths: [.github/workflows/calculator-final-integration.yml]
permissions:
  contents: write
concurrency:
  group: calculator-final-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/win32-calculator-numeric-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile pinned main; regenerate only generated conflicts
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=6d587b674f9116312661d3d474ff8833e3ebecbf
          git merge-base --is-ancestor 7d821e026b7c7cd34cfc07c452647260080e492e "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0')
          paths = [p for p in paths if p]
          if not paths:
              raise SystemExit('Merge failed without resolvable generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Refuse automatic source conflict resolution: ' + p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p], check=True)
              subprocess.run(['git','add','--',p], check=True)
          PY
          fi
          npm run build
          npm test
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          git rm .github/workflows/calculator-final-integration.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check --cached
          git commit -m 'merge: preserve concurrent data recordset changes in Calculator export' -m 'Reconcile pinned main 6d587b674f9116312661d3d474ff8833e3ebecbf with the already-tested numeric compiler. Only generated bundle conflicts are regenerated; source conflicts abort. Rebuild and test the combined source, retain native export archive fix, and remove this one-time integration workflow.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/fix/win32-calculator-numeric-export
