name: Materialize numeric compiler sources
on:
  push:
    branches: [fix/win32-calculator-numeric-export]
    paths: ['.github/numeric-source.*', '.github/workflows/materialize-numeric.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/win32-calculator-numeric-export'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply exact source fingerprints
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const assert = require('node:assert/strict');
          const hash = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
          let encoded = [1,2].map(i => fs.readFileSync('.github/numeric-source.' + i, 'utf8').trim()).join('');
          encoded = encoded.replace('CBrtIkOfTzVR','CBrtIkOfzVR').replace('l/u9HMtFctF4SR','l/u9HMtF4SR').replace('Qfwxs/lLLY','Qfwxs/jLLY');
          const raw = zlib.gunzipSync(Buffer.from(encoded, 'base64'), {maxOutputLength: 1000000});
          assert.equal(hash(raw), '2b39741eb7324cc591a2a521b444167d296306841a49c3508b487ae6ac51cb63');
          const pack = JSON.parse(raw);
          assert.equal(pack.base, '6e6162cbad5edcad474a2121e65e586eb53a687a');
          const prepared = [];
          for (const item of pack.files) {
            assert.ok(/^(src\/native\/|tests\/|tools\/|docs\/|\.github\/workflows\/)/.test(item.path) || item.path === 'README.md');
            assert.ok(!path.isAbsolute(item.path) && !item.path.split('/').includes('..'));
            const exists = fs.existsSync(item.path);
            if (exists) assert.ok(fs.lstatSync(item.path).isFile() && !fs.lstatSync(item.path).isSymbolicLink());
            const old = exists ? fs.readFileSync(item.path) : null;
            assert.equal(old === null ? null : hash(old), item.before, 'Changed baseline: ' + item.path);
            let text = item.content;
            if (text === undefined) {
              const lines = old.toString('utf8').match(/[^\n]*\n|[^\n]+$/g) || [];
              for (const [start,end,replacement] of [...item.edits].reverse()) {
                assert.ok(Number.isInteger(start) && Number.isInteger(end) && start >= 0 && start <= end && end <= lines.length);
                lines.splice(start, end - start, replacement);
              }
              text = lines.join('');
            }
            const data = Buffer.from(text, 'utf8');
            assert.equal(hash(data), item.after, 'Changed result: ' + item.path);
            prepared.push([item.path, data]);
          }
          for (const [file,data] of prepared) {
            fs.mkdirSync(path.dirname(file), {recursive:true});
            fs.writeFileSync(file, data);
          }
          console.log('Verified and materialized ' + prepared.length + ' source files');
          NODE
      - run: npm run build && npm test
      - name: Commit readable source and regenerated bundles
        shell: bash
        run: |
          rm .github/numeric-source.1 .github/numeric-source.2 .github/workflows/materialize-numeric.yml
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git add -u
          git add -f src/native/numeric.js src/native/control-arrays.js tests/win32-numeric.test.mjs tools/win32-numeric-fixtures.mjs tools/test-win32-numeric.ps1 docs/WIN32-NUMERIC.md .github/workflows/win32-numeric.yml
          git commit -m 'feat(win32): native Single/Double arithmetic and indexed Calculator export'
          git push origin HEAD:fix/win32-calculator-numeric-export
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: numeric-transfer-diagnostics
          path: |
            .github/numeric-source.*
            src/native/
            tests/win32-numeric.test.mjs
          include-hidden-files: true
          retention-days: 1
