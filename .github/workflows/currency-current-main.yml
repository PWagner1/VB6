name: Reconcile native Currency with current main
on:
  push:
    branches: [feat/win32-currency-export]
    paths: [.github/workflows/currency-current-main.yml]
permissions:
  contents: write
concurrency:
  group: currency-current-main
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/win32-currency-export
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge pinned main, preserve readable sources and rebuild generated conflicts
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          target=0cc1fee9beb68e418a773eb57d9ee3313a1c9e63
          git merge-base --is-ancestor 523da10a94f3ed70708ff25d309921baaca7278e "$target"
          if ! git merge --no-commit --no-ff "$target"; then
            python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U','-z']).decode().split('\0')
          paths=[p for p in paths if p]
          if not paths: raise SystemExit('Merge failed without generated conflicts')
          for p in paths:
              if not (p.startswith('dist/') or p in ['src/exporter/runtime-payload.js','src/editor/diagnostics-payload.js']):
                  raise SystemExit('Source conflict requires review: '+p)
          for p in paths:
              subprocess.run(['git','checkout','--ours','--',p],check=True)
              subprocess.run(['git','add','--',p],check=True)
          PY
          fi
          npm run build
          npm test
          node tools/win32-bindings-fixtures.mjs
          git add dist src/exporter/runtime-payload.js src/editor/diagnostics-payload.js examples
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git commit -m 'merge: retain native workspace and agent changes with Currency export' -m 'Reconcile pinned main 0cc1fee9beb68e418a773eb57d9ee3313a1c9e63, regenerate only generated conflicts, preserve all source features and run the complete regression suite. Currency and independent foreign-return fixtures remain required Windows checks.'
          npm run build
          git diff --exit-code
          git push origin HEAD:refs/heads/feat/win32-currency-export
